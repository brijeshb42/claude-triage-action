name: Deploy Cloudflare Sandbox Bridge

on:
  workflow_dispatch:
  push:
    branches: [prototype]
    paths:
      - bridge/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-bridge.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-sandbox-bridge
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker and container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANDBOX_API_KEY: ${{ secrets.SANDBOX_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/cloudflare-secrets.env"
          printf 'SANDBOX_API_KEY=%s\n' "$SANDBOX_API_KEY" > "$secrets_file"
          pnpm --dir bridge exec wrangler deploy --secrets-file "$secrets_file"

      - name: Create and hydrate smoke-test sandbox
        id: sandbox
        uses: ./
        with:
          api-url: ${{ vars.SANDBOX_API_URL }}
          api-key: ${{ secrets.SANDBOX_API_KEY }}

      - name: Destroy smoke-test sandbox
        if: always() && steps.sandbox.outputs.sandbox-id
        env:
          SANDBOX_API_URL: ${{ vars.SANDBOX_API_URL }}
          SANDBOX_API_KEY: ${{ secrets.SANDBOX_API_KEY }}
        run: >-
          node "${{ steps.sandbox.outputs.cli-path }}" destroy
          "${{ steps.sandbox.outputs.sandbox-id }}"
