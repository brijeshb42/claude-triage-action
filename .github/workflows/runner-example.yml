name: Runner-sandboxed issue fix

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue in this repository to analyze and attempt to fix
        required: true
        type: number

permissions: {}

concurrency:
  group: runner-issue-${{ inputs.issue-number }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      issues: read
      id-token: write
    outputs:
      artifact: ${{ steps.runner.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Analyze and attempt a fix inside gVisor
        id: runner
        uses: ./runner
        with:
          github-token: ${{ github.token }}
          issue-number: ${{ inputs.issue-number }}
          artifact-name: runner-fix-${{ github.run_id }}-${{ github.run_attempt }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

  publish:
    needs: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./runner/publish
        with:
          github-token: ${{ github.token }}
          issue-number: ${{ inputs.issue-number }}
          artifact-name: ${{ needs.agent.outputs.artifact }}
          default-branch: ${{ github.event.repository.default_branch }}
