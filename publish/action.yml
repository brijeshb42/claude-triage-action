name: Publish Cloudflare-sandboxed Claude triage
description: Validate an untrusted triage patch, create a draft pull request, and report on the issue.

inputs:
  artifact-name:
    description: Artifact produced by the triage action.
    required: true
  github-token:
    description: Write-enabled GitHub token used only by this publisher action.
    required: true
  issue-number:
    description: Issue number that triggered triage.
    required: true
  default-branch:
    description: Base branch for a draft pull request.
    required: true
  working-directory:
    description: Checked-out repository where the patch is validated and committed.
    default: .
  preview-directory:
    description: Repository-relative disposable preview directory allowed in a second commit.
    default: ''

outputs:
  pr-url:
    description: URL of the draft pull request, when a patch was accepted.
    value: ${{ steps.pr.outputs.url }}
  pr-number:
    description: Number of the draft pull request, when a patch was accepted.
    value: ${{ steps.pr.outputs.number }}

runs:
  using: composite
  steps:
    - name: Set up the publisher's Node.js runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.2

    - name: Download the untrusted agent artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/claude-triage

    - name: Resolve the current pull request base
      id: base
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH"
        git switch --detach FETCH_HEAD
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Validate and stage the patch without executing repository code
      id: patch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PATCH_PATH: ${{ runner.temp }}/claude-triage/claude-triage.patch
        PREVIEW_DIRECTORY: ${{ inputs.preview-directory }}
        RESULT_PATH: ${{ runner.temp }}/claude-triage/claude-triage-result.json
      run: |
        set -euo pipefail
        case "$PREVIEW_DIRECTORY" in
          '') ;;
          .|/*|..|../*|*/..|*/../*)
            echo "Invalid preview directory: $PREVIEW_DIRECTORY" >&2
            exit 1
            ;;
        esac
        test "$(wc -c < "$PATCH_PATH")" -le 8388608
        if [ ! -s "$PATCH_PATH" ]; then
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git -c core.hooksPath=/dev/null apply --binary --index --whitespace=nowarn "$PATCH_PATH"
        git diff --cached --check

        changed_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
        test "$changed_count" -le 100
        preview_changed=false
        fix_changed=false
        while IFS= read -r -d '' changed_path; do
          case "$changed_path" in
            .github/*|.gitmodules|.gitattributes)
              echo "Refusing agent change to protected path: $changed_path" >&2
              exit 1
              ;;
          esac
          if [ -n "$PREVIEW_DIRECTORY" ] && { [ "$changed_path" = "$PREVIEW_DIRECTORY" ] || [[ "$changed_path" = "$PREVIEW_DIRECTORY/"* ]]; }; then
            preview_changed=true
          else
            fix_changed=true
          fi
        done < <(git diff --cached --name-only -z)

        if git diff --cached --summary | grep -q 'mode 120000'; then
          echo 'Refusing agent-created or modified symbolic links.' >&2
          exit 1
        fi
        if [ "$fix_changed" != true ]; then
          echo 'Refusing a preview-only patch without a repository fix.' >&2
          exit 1
        fi

        preview_reported_ready="$(node --input-type=module - "$RESULT_PATH" <<'NODE'
        import { readFileSync } from 'node:fs';
        const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
        process.stdout.write(result.previewReady === true ? 'true' : 'false');
        NODE
        )"
        preview_ready=false
        if [ "$preview_changed" = true ] && [ "$preview_reported_ready" = true ]; then
          preview_ready=true
        elif [ "$preview_changed" = true ]; then
          echo 'Dropping preview changes because sandbox validation did not succeed.' >&2
          git restore --source=HEAD --staged --worktree -- "$PREVIEW_DIRECTORY"
        fi

        {
          echo "has-changes=true"
          echo "preview-ready=$preview_ready"
        } >> "$GITHUB_OUTPUT"

    - name: Prepare pull request metadata
      id: metadata
      if: steps.patch.outputs.has-changes == 'true'
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        RESULT_PATH: ${{ runner.temp }}/claude-triage/claude-triage-result.json
        PREVIEW_READY: ${{ steps.patch.outputs.preview-ready }}
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
        const result = JSON.parse(readFileSync(process.env.RESULT_PATH, 'utf8'));
        const title = String(result.prTitle || `fix: address issue #${process.env.ISSUE_NUMBER}`)
          .replace(/[\r\n]+/g, ' ')
          .slice(0, 240);
        const body = [
          String(result.prBody || result.summary || 'Automated triage fix.'),
          '',
          `Closes #${process.env.ISSUE_NUMBER}`,
          '',
          `<!-- claude-triage-issue:${process.env.ISSUE_NUMBER} -->`,
          `<!-- claude-triage-preview:${process.env.PREVIEW_READY === 'true' ? 'pending' : 'none'} -->`,
          '',
          '> Draft created by the Cloudflare-sandboxed triage prototype. Review before merging.',
        ].join('\n');
        const metadataPath = `${process.env.RUNNER_TEMP}/claude-triage-pr.json`;
        writeFileSync(metadataPath, JSON.stringify({ title, body }));
        appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\nmetadata-path=${metadataPath}\n`);
        NODE

    - name: Create the remote branch at the validated base
      id: remote-branch
      if: steps.patch.outputs.has-changes == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const branch = `claude/triage-${process.env.ISSUE_NUMBER}-${process.env.RUN_ID}-${process.env.RUN_ATTEMPT}`;
          await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/heads/${branch}`,
            sha: process.env.BASE_SHA,
          });
          core.setOutput('name', branch);

    - name: Commit and push the accepted patch
      id: branch
      if: steps.patch.outputs.has-changes == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BRANCH_NAME: ${{ steps.remote-branch.outputs.name }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        PR_TITLE: ${{ steps.metadata.outputs.title }}
        PREVIEW_DIRECTORY: ${{ inputs.preview-directory }}
        PREVIEW_READY: ${{ steps.patch.outputs.preview-ready }}
      run: |
        set -euo pipefail
        branch="$BRANCH_NAME"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -c "$branch"
        if [ "$PREVIEW_READY" = true ]; then
          git restore --staged -- "$PREVIEW_DIRECTORY"
        fi
        git -c core.hooksPath=/dev/null commit -m "$PR_TITLE"
        if [ "$PREVIEW_READY" = true ]; then
          git add --all -- "$PREVIEW_DIRECTORY"
          git -c core.hooksPath=/dev/null commit -m "docs: add triage preview for issue #${ISSUE_NUMBER}"
        fi
        git push origin "HEAD:refs/heads/$branch"
        echo "name=$branch" >> "$GITHUB_OUTPUT"

    - name: Remove an unmodified remote branch after a push failure
      if: >-
        always() &&
        steps.remote-branch.outcome == 'success' &&
        steps.branch.outcome == 'failure'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BRANCH_NAME: ${{ steps.remote-branch.outputs.name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await github.rest.git.deleteRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `heads/${process.env.BRANCH_NAME}`,
          });

    - name: Create draft pull request
      id: pr
      if: steps.patch.outputs.has-changes == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE_BRANCH: ${{ inputs.default-branch }}
        HEAD_BRANCH: ${{ steps.branch.outputs.name }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        METADATA_PATH: ${{ steps.metadata.outputs.metadata-path }}
        PREVIEW_READY: ${{ steps.patch.outputs.preview-ready }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
          const { data: pullRequest } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            base: process.env.BASE_BRANCH,
            head: process.env.HEAD_BRANCH,
            title: metadata.title,
            body: metadata.body,
            draft: true,
          });
          const labels = ['claude-triage'];
          if (process.env.PREVIEW_READY === 'true') {
            labels.push('claude-triage-preview');
          }
          for (const name of labels) {
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color: name === 'claude-triage-preview' ? '1d76db' : '5319e7',
                description: name === 'claude-triage-preview'
                  ? 'A validated disposable StackBlitz preview is ready to publish'
                  : 'Draft fix created by automated issue triage',
              });
            }
          }
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pullRequest.number,
            labels,
          });
          const issueMarker = `<!-- claude-triage-issue:${process.env.ISSUE_NUMBER} -->`;
          const previousPullRequests = await github.paginate(github.rest.pulls.list, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100,
          });
          for (const previous of previousPullRequests) {
            const isOwnedTriagePullRequest =
              previous.number !== pullRequest.number &&
              previous.body?.includes(issueMarker) &&
              previous.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              previous.head.ref.startsWith(`claude/triage-${process.env.ISSUE_NUMBER}-`);
            if (!isOwnedTriagePullRequest) {
              continue;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: previous.number,
              body: `Superseded by #${pullRequest.number}.`,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: previous.number,
              state: 'closed',
            });
          }
          core.setOutput('url', pullRequest.html_url);
          core.setOutput('number', String(pullRequest.number));

    - name: Publish triage result
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        RESULT_PATH: ${{ runner.temp }}/claude-triage/claude-triage-result.json
        PATCH_OUTCOME: ${{ steps.patch.outcome }}
        PR_URL: ${{ steps.pr.outputs.url }}
        PREVIEW_READY: ${{ steps.patch.outputs.preview-ready }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- claude-cloudflare-triage -->';
          let result;
          try {
            result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
          } catch {
            result = {
              summary: 'The triage run failed before producing a result.',
              probableCause: 'No result artifact was available.',
              confidence: 'low',
              validation: 'Not run.',
            };
          }
          const prLine = process.env.PR_URL
            ? `**Draft fix:** ${process.env.PR_URL}`
            : process.env.PATCH_OUTCOME === 'failure'
              ? '**Draft fix:** A patch was produced but rejected by the publisher safety checks.'
              : '**Draft fix:** No code change was produced.';
          const previewLine = process.env.PREVIEW_READY === 'true' && process.env.PR_URL
            ? '**StackBlitz preview:** Publication is pending in the pull request CI.'
            : '**StackBlitz preview:** Not produced for this run.';
          const body = [
            marker,
            '## Claude triage',
            '',
            String(result.summary),
            '',
            `**Probable cause (${result.confidence} confidence):** ${result.probableCause}`,
            '',
            `**Validation:** ${result.validation}`,
            '',
            prLine,
            '',
            '<!-- claude-triage-preview-status -->',
            previewLine,
          ].join('\n');
          const issue_number = Number(process.env.ISSUE_NUMBER);
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find((comment) => comment.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
          }
