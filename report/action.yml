name: Report read-only Claude triage
description: Publish a validated triage artifact to its issue without granting write access to Claude.

inputs:
  artifact-name:
    description: Durable triage artifact to report.
    required: true
  source-run-id:
    description: Workflow run that created the triage artifact.
    required: true
  github-token:
    description: Issue-write token used only by this trusted reporter.
    required: true
  issue-number:
    description: Issue receiving the triage report.
    required: true
  mode:
    description: Report an in-progress fix or a completed triage-only outcome.
    required: true

runs:
  using: composite
  steps:
    - name: Set up the reporter's Node.js runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.2

    - name: Download the durable triage artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.github-token }}
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/claude-triage-report
        run-id: ${{ inputs.source-run-id }}

    - name: Validate the durable triage artifact
      shell: bash
      env:
        ARTIFACT_DIRECTORY: ${{ runner.temp }}/claude-triage-report
        EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EXPECTED_ISSUE_NUMBER: ${{ inputs.issue-number }}
        EXPECTED_REPOSITORY: ${{ github.repository }}
        EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        EXPECTED_SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
      run: node "$GITHUB_ACTION_PATH/../dist/validate-triage-artifact.mjs"

    - name: Publish the read-only triage report
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        MODE: ${{ inputs.mode }}
        RESULT_PATH: ${{ runner.temp }}/claude-triage-report/triage-result.json
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
          const marker = '<!-- claude-cloudflare-triage -->';
          const disposition = result.disposition.replaceAll('_', ' ');
          const status = process.env.MODE === 'in-progress'
            ? '**Fix:** A sandboxed fix attempt is in progress.'
            : `**Fix:** Not started (${disposition}).`;
          const body = [
            marker,
            '## Claude triage',
            '',
            String(result.summary),
            '',
            `**Probable cause (${result.confidence} confidence):** ${result.probableCause}`,
            '',
            '**Evidence:**',
            ...result.evidence.map((item) => `- ${item}`),
            '',
            status,
            '',
            '**Validation:** Read-only triage only; no repository commands or tests were run.',
          ].join('\n');
          const issue_number = Number(process.env.ISSUE_NUMBER);
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find((comment) => comment.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
          }
